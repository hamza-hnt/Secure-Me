name: Publish npm release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  release:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - id: release
        run: node scripts/release.mjs check
  test:
    needs: release
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.release.outputs.commit }}
      upload-release-artifact: true
  publish:
    name: Publish tested archive with npm OIDC
    needs: [release, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-${{ github.run_id }}
          path: .artifacts
      - name: Verify source, archive, npm support and unpublished version
        run: node scripts/release.mjs verify
      # Configure npm's trusted publisher for this filename and environment "npm",
      # with direct "npm publish" allowed (new configurations default to stage-only).
      # https://docs.npmjs.com/trusted-publishers/
      - name: Publish without repacking or lifecycle scripts
        env:
          RELEASE_DIST_TAG: ${{ needs.release.outputs.dist-tag }}
        run: npm publish .artifacts/package.tgz --access public --provenance --ignore-scripts --registry https://registry.npmjs.org --tag "$RELEASE_DIST_TAG"
